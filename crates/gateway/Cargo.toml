[package]
name = "gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
nar-metadata = { path = "../nar-metadata" }
anyhow = "1.0.104"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["rustls", "http2", "stream", "json"] }
thiserror = "2.0.18"
url = "2.5.8"
nix-narinfo = "0.4.0"
nix-derivation = "0.6.1"

[dev-dependencies]
serde_json = "1.0.145"
