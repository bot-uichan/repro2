[package]
name = "file-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
libc = "0.2"
futures-util = "0.3"
sha2 = "0.10"
tempfile = "3"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
