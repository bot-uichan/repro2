[package]
name = "builder"
default-run = "builder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.6", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
nix-derivation = "0.6.1"
libc = "0.2"
nar-metadata = { path = "../nar-metadata" }
sha2 = "0.10"
tempfile = "3"
